name: Build Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | head -n 1 | cut -d'"' -f2 | cut -d'.' -f1)
          if [ "$JAVA_VER" -lt 21 ]; then
            echo "Error: Active Java version $JAVA_VER is below required Java 21!"
            exit 1
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies
        run: |
          npm install --no-audit --no-fund
          if ! node -e "require('@capacitor/core')" 2>/dev/null; then
            npm install --no-audit --no-fund @capacitor/core @capacitor/cli @capacitor/android
          fi

      - name: Build React/TypeScript application
        run: npm run build

      - name: Sync Capacitor
        run: |
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            echo '{"appId": "com.nexus.studyapp", "appName": "Nexus Academic", "webDir": "dist"}' > capacitor.config.json
          fi
          if [ ! -d android ]; then
            npx cap add android
          fi
          if ! grep -q "kotlin-stdlib-jdk8:1.8.22" android/build.gradle; then
            node -e '
              const fs = require("fs");
              let content = fs.readFileSync("android/build.gradle", "utf8");
              if (!content.includes("kotlin-stdlib-jdk8:1.8.22")) {
                content = content.replace("allprojects {", `allprojects {\n    configurations.all {\n        resolutionStrategy {\n            force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"\n            force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"\n            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"\n        }\n    }`);
                fs.writeFileSync("android/build.gradle", content);
              }
            '
          fi
          npx cap sync android

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            keytool -genkey -v -keystore ./debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f ./debug.keystore ]; then
            echo "Error: debug.keystore was not created!"
            exit 1
          fi

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK output
        run: |
          EXPECTED_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$EXPECTED_APK" ]; then
            echo "Expected debug APK successfully generated at $EXPECTED_APK"
          else
            echo "Expected APK not found at $EXPECTED_APK!"
            echo "Searching in android/app/build/outputs/apk:"
            find android/app/build/outputs/apk -name "*.apk" || true
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
