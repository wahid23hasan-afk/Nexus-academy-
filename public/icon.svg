<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Squircle Icon Base -->
    <linearGradient id="nexusBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091122"/>
      <stop offset="35%" stop-color="#050B17"/>
      <stop offset="75%" stop-color="#03060E"/>
      <stop offset="100%" stop-color="#020307"/>
    </linearGradient>

    <!-- Vibrant Neon Green & Cyan Gradient for Monogram N -->
    <linearGradient id="nexusNeonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#73FF00"/>
      <stop offset="25%" stop-color="#39FF14"/>
      <stop offset="65%" stop-color="#00FFB2"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <!-- Left Leg Gradient -->
    <linearGradient id="leftLegGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#73FF00"/>
      <stop offset="60%" stop-color="#39FF14"/>
      <stop offset="100%" stop-color="#00E676"/>
    </linearGradient>

    <!-- Right Leg Gradient -->
    <linearGradient id="rightLegGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FFB2"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>

    <!-- Cap Frame Wire Gradient -->
    <linearGradient id="capWireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#73FF00"/>
      <stop offset="50%" stop-color="#00FFB2"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <!-- Amber Gold Tassel Node -->
    <linearGradient id="goldTasselGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="50%" stop-color="#FFD600"/>
      <stop offset="100%" stop-color="#FF9100"/>
    </linearGradient>

    <!-- Radial Core Glow -->
    <radialGradient id="nexusAuraGlow" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0.25"/>
      <stop offset="55%" stop-color="#00E5FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Multi-stage Neon Filter -->
    <filter id="neonAura" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blurWide"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blurMed"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blurSharp"/>
      <feMerge>
        <feMergeNode in="blurWide"/>
        <feMergeNode in="blurMed"/>
        <feMergeNode in="blurSharp"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Node Glow -->
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Obsidian App Badge Base (Squircle) -->
  <rect width="512" height="512" rx="118" fill="url(#nexusBgGrad)" />

  <!-- Ambient Glow in Badge Center -->
  <circle cx="256" cy="256" r="230" fill="url(#nexusAuraGlow)"/>

  <!-- Outer Border Stroke with Glowing Highlights -->
  <rect width="504" height="504" x="4" y="4" rx="114" fill="none" stroke="url(#nexusNeonGrad)" stroke-width="2.5" stroke-opacity="0.35"/>

  <!-- INNER LOGO GROUP WITH HIGH-VIBRANCY NEON GLOW -->
  <g filter="url(#neonAura)">

    <!-- ================= 1. GRADUATION CAP & NEURAL NODES ================= -->
    <!-- Mortarboard Diamond Frame -->
    <path d="M 256,128 L 356,176 L 256,224 L 156,176 Z" 
          fill="none" 
          stroke="url(#capWireGrad)" 
          stroke-width="5.5" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>

    <!-- Tassel Wire -->
    <line x1="256" y1="176" x2="230" y2="195" 
          stroke="#FFD600" 
          stroke-width="4.5" 
          stroke-linecap="round"/>

    <!-- Tassel Gold Node (Center Accent) -->
    <circle cx="258" cy="176" r="9" fill="url(#goldTasselGrad)" filter="url(#nodeGlow)"/>
    <circle cx="258" cy="176" r="3.5" fill="#FFFFFF"/>

    <!-- Top Apex Node (Green/Lime) -->
    <circle cx="256" cy="128" r="9.5" fill="#73FF00" filter="url(#nodeGlow)"/>
    <circle cx="256" cy="128" r="4" fill="#FFFFFF"/>

    <!-- Left Wing Node (Lime/Cyan) -->
    <circle cx="156" cy="176" r="9" fill="#39FF14" filter="url(#nodeGlow)"/>
    <circle cx="156" cy="176" r="3.5" fill="#FFFFFF"/>

    <!-- Right Wing Node (Cyan/Aqua) -->
    <circle cx="356" cy="176" r="9" fill="#00E5FF" filter="url(#nodeGlow)"/>
    <circle cx="356" cy="176" r="3.5" fill="#FFFFFF"/>

    <!-- ================= 2. THE MONOGRAM 'N' ================= -->
    <!-- Left Vertical Leg of 'N' -->
    <path d="M 172,212 
             L 212,212 
             L 212,342 
             C 212,347 207,352 201,352 
             L 183,352 
             C 177,352 172,347 172,342 Z" 
          fill="url(#leftLegGrad)"/>

    <!-- Right Vertical Leg of 'N' -->
    <path d="M 302,212 
             L 340,212 
             C 346,212 351,217 351,223 
             L 351,342 
             C 351,347 346,352 340,352 
             L 302,352 Z" 
          fill="url(#rightLegGrad)"/>

    <!-- Central Dynamic Slanted Diagonal Ribbon of 'N' -->
    <path d="M 208,190 
             L 242,190 
             L 338,338 
             C 341,343 338,350 332,350 
             L 298,350 
             L 208,206 
             C 205,201 208,190 208,190 Z" 
          fill="url(#nexusNeonGrad)"/>

    <!-- Specular 3D Reflection Lines for Depth & Shine -->
    <path d="M 212,204 L 240,192 L 334,338 L 322,346 Z" fill="#FFFFFF" opacity="0.25"/>
    <path d="M 174,214 L 186,214 L 186,348 L 174,348 Z" fill="#FFFFFF" opacity="0.20"/>
    <path d="M 338,214 L 349,214 L 349,348 L 338,348 Z" fill="#FFFFFF" opacity="0.25"/>

    <!-- ================= 3. LOWER HORIZON ACCENT ARC ================= -->
    <path d="M 148,374 Q 256,400 364,374" 
          fill="none" 
          stroke="url(#nexusNeonGrad)" 
          stroke-width="5" 
          stroke-linecap="round" 
          opacity="0.95"/>

  </g>
</svg>
